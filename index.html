<script>

function span(a){const m=Math.min(...a.map(t=>t.t));return Math.max(7,Math.min(90,(Date.now()-m)/D))}

function insight(){const n=Date.now(),l=S.tx.filter(t=>t.t>=n-7*D),i=l.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0),o=l.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0),sv=l.filter(t=>t.cat==="save").reduce((s,t)=>s+t.amount,0);
if(S.debts.length&&dDaily()>0){const t=[...S.debts].sort((a,b)=>dCost(b)-dCost(a))[0];return "Your "+t.lender+" debt costs ₦"+fmt(dCost(t))+" a day. Kill it first; everything else can wait."}
if(!l.length)return "Log a few transactions and I’ll start spotting where your money really goes.";
if(i>0&&o>i)return "This week you spent ₦"+fmt(o-i)+" more than you earned. One big expense and you’re borrowing.";

return "You’re tracking. That already puts you ahead of most people."}

function sim(v){v=+v;const m=yrs(v),f=m>=720?"50+ years":(m>=12?Math.floor(m/12)+"y ":"")+(m%12?m%12+"m":m>=12?"":"now");$("#sv").textContent="Investing ₦"+fmt(v)+" / month";$("#so").textContent=m===0?"You’re there":f;$("#sd").textContent=m>0&&m<720?"Free by "+new Date(Date.now()+m*30.4*D).toLocaleDateString("en",{month:"long",year:"numeric"}):m>=720?"Raise the amount to bring this closer.":"Passive income already covers your expenses."}
function setPas(){const a=parseInt($("#pI").value,10);if(isNaN(a)||a<0)return toast("Enter a valid amount");S.user.passiveIncomeMonthly=a;closeModal();toast("Updated");render()}
function openInsights(){const s=Date.now()-30*D,b={};S.tx.filter(t=>t.type==="out"&&t.t>=s&&t.cat!=="save").forEach(t=>b[t.cat]=(b[t.cat]||0)+t.amount);const r=Object.entries(b).sort((a,c)=>c[1]-a[1]),tot=r.reduce((a,x)=>a+x[1],0);openModal('<h3>📊 Last 30 days</h3>'+(r.length?'<div class="mp">Biggest leak: <b style="color:var(--text)">'+((OUT.find(x=>x.id===r[0][0])||{}).l||r[0][0])+'</b> at '+Math.round(r[0][1]/tot*100)+'% of spending.</div>'+r.map(([k,v])=>{const c=OUT.find(x=>x.id===k)||{l:k,e:"•"};return '<div class="row"><span>'+c.e+' '+c.l+'</span><b>₦'+fmt(v)+'</b></div><div class="bar" style="margin:0 0 6px"><i style="width:'+Math.round(v/tot*100)+'%"></i></div>'}).join(""):'<div class="mp">Log some expenses to see where your money goes.</div>')+X)}
function openBadges(){openModal('<h3>🏅 Badges</h3><div class="badges">'+ACH.map(a=>'<div class="bd '+(S.ach[a[0]]?"on":"")+'"><span>'+a[1]+'</span><b>'+a[2]+'</b><small>'+a[3]+'</small></div>').join("")+'</div>'+X)}
function openSettings(){openModal('<h3>⚙️ Settings</h3><div class="field"><label>Name</label><input id="sN" value="'+esc(S.user.name)+'" maxlength="20"/></div><div class="field"><label>Monthly income estimate (₦)</label><input id="sI" type="number" inputmode="numeric" value="'+S.user.monthlyIncomeEst+'"/></div><div class="field"><label>Monthly expenses estimate (₦)</label><input id="sE" type="number" inputmode="numeric" value="'+S.user.monthlyExpensesEst+'"/></div><button class="btn p big" onclick="setSet()">Save</button><button class="btn big" style="margin-top:8px" onclick="exportData()">Export my data (JSON)</button><button class="btn d big" style="margin-top:8px" onclick="resetApp()">Reset everything</button>'+X)}
function setSet(){S.user.name=$("#sN").value.trim().slice(0,20)||S.user.name;S.user.monthlyIncomeEst=parseInt($("#sI").value,10)||S.user.monthlyIncomeEst;S.user.monthlyExpensesEst=parseInt($("#sE").value,10)||S.user.monthlyExpensesEst;closeModal();toast("Saved");render()}
function exportData(){try{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="naira-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(u);toast("Backup downloaded")}catch(e){toast("Export failed. Copy your data from Settings instead.")}}
function resetApp(){if(!confirm("Delete ALL your data? This cannot be undone.")||!confirm("Are you absolutely sure?"))return;try{localStorage.removeItem(KEY)}catch(e){}S=null;PREV={};closeModal();tab="home";render()}
function share(){const t=encodeURIComponent("I’m tracking my money with Naira.\n\nFreedom score: "+fPct()+"% ("+lvl(fPct())[1]+")\nVault: ₦"+fmt(vault())+"\nBuilding toward financial freedom, one naira at a time. 🕊️");window.open("https://wa.me/?text="+t,"_blank")}
function demo(){S=defs();Object.assign(S.user,{name:"Tunde",monthlyIncomeEst:250000,monthlyExpensesEst:140000,passiveIncomeMonthly:35000,lifestyle:2,onboarded:true,onboardedAt:Date.now()});const o=[["food",2500],["transport",1500],["data",3000],["fun",4000],["utilities",5000],["family",10000],["shopping",8000]];for(let i=0;i<30;i++){const t=Date.now()-i*D-rand(0,8)*H;if(i%10===0)S.tx.push(mk("in","salary",200000,"Salary",t));if(i%4===1)S.tx.push(mk("in","gig",rand(8,25)*1000,"Side job",t));const k=o[rand(0,6)];S.tx.push(mk("out",k[0],k[1]+rand(0,20)*100,"",t));if(i%3===0)S.tx.push(mk("out","save",rand(1,5)*1000,"Vault deposit",t))}S.habits.savingsStreak=4;S.habits.lastSaveDate=new Date().toDateString();S.debts.push({id:"debt_demo",lender:"QuickCash",balance:40000,rate:5,ratePeriod:"week"});render()}
Object.assign(window,{nav,openAdd,saveTx,delTx,openSave,doSave,openNewAjo,mkAjo,ajoPay,ajoDetail,ajoOut,ajoDel,openDebts,openNewDebt,mkDebt,payDebt,doPay,openFreedom,sim,setPas,openInsights,openBadges,openSettings,setSet,exportData,resetApp,share,demo,closeModal,$});

init();
